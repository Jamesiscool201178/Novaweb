<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaWeb Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
    <div class="logo">Nova<span>Web</span></div>
    <a href="index.html">← Back to website</a>
</header>

<main class="login-page">

    <div class="login-card">

        <h1>Welcome to NovaWeb</h1>
        <p class="login-subtitle">Choose how you want to sign in.</p>

        <!-- ACCOUNT TYPE -->
        <div class="account-choice">

            <button id="clientChoice" class="account-button active">
                <span>👤</span>
                <strong>Client</strong>
                <small>Access your projects</small>
            </button>

            <button id="adminChoice" class="account-button">
                <span>🛡️</span>
                <strong>Admin</strong>
                <small>Staff dashboard</small>
            </button>

        </div>

        <div id="selectedMessage" class="selected-message">
            Client login selected
        </div>

        <!-- LOGIN / SIGNUP -->
        <div id="loginForm">

            <div id="signupFields" style="display:none;">

                <label>Full Name</label>
                <input
                    type="text"
                    id="name"
                    placeholder="Your name"
                >

            </div>

            <label>Email</label>
            <input
                type="email"
                id="email"
                placeholder="you@example.com"
                required
            >

            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button id="mainButton" class="login-button">
                Client Login
            </button>

            <p id="switchText">
                Don't have a client account?
                <button id="switchMode" class="text-button">
                    Create one
                </button>
            </p>

        </div>

        <p id="message"></p>

    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>

<script>

let selectedType = "client";
let signupMode = false;

const clientChoice = document.getElementById("clientChoice");
const adminChoice = document.getElementById("adminChoice");
const selectedMessage = document.getElementById("selectedMessage");

const mainButton = document.getElementById("mainButton");
const switchMode = document.getElementById("switchMode");
const switchText = document.getElementById("switchText");
const signupFields = document.getElementById("signupFields");

const message = document.getElementById("message");


// ==============================
// SELECT CLIENT
// ==============================

clientChoice.addEventListener("click", () => {

    selectedType = "client";

    clientChoice.classList.add("active");
    adminChoice.classList.remove("active");

    selectedMessage.textContent = "Client login selected";

    mainButton.textContent = signupMode
        ? "Create Client Account"
        : "Client Login";

    switchText.style.display = "block";
});


// ==============================
// SELECT ADMIN
// ==============================

adminChoice.addEventListener("click", () => {

    selectedType = "admin";

    adminChoice.classList.add("active");
    clientChoice.classList.remove("active");

    selectedMessage.textContent = "Admin login selected";

    // Admin accounts cannot be created from here
    signupMode = false;

    signupFields.style.display = "none";

    mainButton.textContent = "Admin Login";

    switchText.style.display = "none";
});


// ==============================
// SWITCH SIGNUP
// ==============================

switchMode.addEventListener("click", () => {

    signupMode = !signupMode;

    if (signupMode) {

        signupFields.style.display = "block";

        mainButton.textContent = "Create Client Account";

        switchText.innerHTML =
            `Already have a client account?
            <button id="switchMode" class="text-button">
                Login
            </button>`;

    } else {

        signupFields.style.display = "none";

        mainButton.textContent = "Client Login";

        switchText.innerHTML =
            `Don't have a client account?
            <button id="switchMode" class="text-button">
                Create one
            </button>`;
    }

    document.getElementById("switchMode").addEventListener("click", () => {
        switchMode.click();
    });

});


// ==============================
// LOGIN / SIGNUP
// ==============================

mainButton.addEventListener("click", async () => {

    message.textContent = "";
    message.style.color = "";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
        message.textContent = "Please enter your email and password.";
        return;
    }

    mainButton.disabled = true;
    mainButton.textContent = "Please wait...";


    try {

        // ==========================
        // CLIENT SIGNUP
        // ==========================

        if (signupMode && selectedType === "client") {

            const name =
                document.getElementById("name").value.trim();

            if (!name) {
                throw new Error("Please enter your name.");
            }

            const { data, error } =
                await supabaseClient.auth.signUp({

                    email: email,
                    password: password,

                    options: {
                        data: {
                            full_name: name
                        }
                    }

                });

            if (error) throw error;

            if (!data.session) {

                message.textContent =
                    "Account created! Check your email to confirm your account.";

                mainButton.disabled = false;
                mainButton.textContent = "Create Client Account";

                return;
            }

            // Create client profile
            await supabaseClient
                .from("profiles")
                .upsert({
                    id: data.user.id,
                    email: email,
                    full_name: name,
                    role: "customer"
                });

            window.location.href = "dashboard.html";

            return;
        }


        // ==========================
        // LOGIN
        // ==========================

        const { data, error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

        if (error) throw error;

        const user = data.user;


        // ==========================
        // GET REAL ACCOUNT ROLE
        // ==========================

        const { data: profile, error: profileError } =
            await supabaseClient
                .from("profiles")
                .select("role")
                .eq("id", user.id)
                .maybeSingle();

        if (profileError) throw profileError;


        // ==========================
        // ADMIN LOGIN
        // ==========================

        if (selectedType === "admin") {

            if (!profile || profile.role !== "staff") {

                await supabaseClient.auth.signOut();

                throw new Error(
                    "This account is not an admin/staff account."
                );
            }

            window.location.href = "admin.html";
            return;
        }


        // ==========================
        // CLIENT LOGIN
        // ==========================

        if (!profile || profile.role !== "customer") {

            await supabaseClient.auth.signOut();

            throw new Error(
                "This account is not a client account."
            );
        }

        window.location.href = "dashboard.html";

    } catch (error) {

        console.error(error);

        message.textContent = error.message;

        mainButton.disabled = false;

        mainButton.textContent =
            selectedType === "admin"
                ? "Admin Login"
                : signupMode
                    ? "Create Client Account"
                    : "Client Login";
    }

});

</script>

</body>
</html>
