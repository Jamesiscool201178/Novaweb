<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaWeb — Client Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
    <div class="nav-container">

        <a href="index.html" class="logo">
            Nova<span>Web</span>
        </a>

        <a href="index.html" class="nav-login">
            ← Back to Website
        </a>

    </div>
</header>


<main class="auth-page">

    <div class="auth-container">

        <div class="auth-header">

            <div class="hero-badge">
                🔐 NovaWeb Client Portal
            </div>

            <h1 id="authTitle">
                Welcome back
            </h1>

            <p id="authSubtitle">
                Log in to view your projects and updates.
            </p>

        </div>


        <form id="authForm">

            <!-- NAME -->
            <div
                class="form-group"
                id="nameGroup"
                style="display: none;"
            >

                <label for="fullName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Your full name"
                >

            </div>


            <!-- EMAIL -->
            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <!-- PASSWORD -->
            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    minlength="6"
                    required
                >

            </div>


            <!-- MESSAGE -->
            <div
                id="authMessage"
                class="form-message"
            ></div>


            <!-- BUTTON -->
            <button
                type="submit"
                id="authButton"
                class="submit-button"
            >
                Login
            </button>

        </form>


        <!-- SWITCH LOGIN / SIGNUP -->
        <div class="auth-switch">

            <span id="switchText">
                Don't have an account?
            </span>

            <button
                type="button"
                id="switchMode"
                class="text-button"
            >
                Create account
            </button>

        </div>

    </div>

</main>


<footer class="footer">

    <div class="footer-bottom">

        <p>
            © 2026 NovaWeb. All rights reserved.
        </p>

    </div>

</footer>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>


<script>

let signupMode = false;


/* ELEMENTS */

const authForm =
    document.getElementById("authForm");

const authButton =
    document.getElementById("authButton");

const authMessage =
    document.getElementById("authMessage");

const authTitle =
    document.getElementById("authTitle");

const authSubtitle =
    document.getElementById("authSubtitle");

const nameGroup =
    document.getElementById("nameGroup");

const fullName =
    document.getElementById("fullName");

const email =
    document.getElementById("email");

const password =
    document.getElementById("password");

const switchMode =
    document.getElementById("switchMode");

const switchText =
    document.getElementById("switchText");


/* MESSAGE FUNCTION */

function showMessage(message, type = "") {

    authMessage.textContent = message;

    authMessage.className = "form-message";

    if (type) {
        authMessage.classList.add(type);
    }

}


/* SWITCH BETWEEN LOGIN AND SIGNUP */

switchMode.addEventListener("click", () => {

    signupMode = !signupMode;

    showMessage("");


    if (signupMode) {

        authTitle.textContent =
            "Create your account";

        authSubtitle.textContent =
            "Create a NovaWeb account to track your website.";

        nameGroup.style.display =
            "block";

        fullName.required = true;

        authButton.textContent =
            "Create Account";

        switchText.textContent =
            "Already have an account?";

        switchMode.textContent =
            "Login";

    } else {

        authTitle.textContent =
            "Welcome back";

        authSubtitle.textContent =
            "Log in to view your projects and updates.";

        nameGroup.style.display =
            "none";

        fullName.required = false;

        authButton.textContent =
            "Login";

        switchText.textContent =
            "Don't have an account?";

        switchMode.textContent =
            "Create account";

    }

});


/* FORM SUBMISSION */

authForm.addEventListener("submit", async (event) => {

    event.preventDefault();

    showMessage("");

    authButton.disabled = true;


    try {

        const userEmail =
            email.value.trim();

        const userPassword =
            password.value;

        /* ==========================
           SIGN UP
        ========================== */

        if (signupMode) {

            const name =
                fullName.value.trim();


            if (!name) {

                throw new Error(
                    "Please enter your full name."
                );

            }


            if (userPassword.length < 6) {

                throw new Error(
                    "Your password must be at least 6 characters."
                );

            }


            authButton.textContent =
                "Creating Account...";


            /* CREATE SUPABASE ACCOUNT */

            const { data, error } =
                await supabaseClient.auth.signUp({

                    email: userEmail,

                    password: userPassword,

                    options: {

                        data: {
                            full_name: name
                        }

                    }

                });


            if (error) {
                throw error;
            }


            if (!data.user) {

                throw new Error(
                    "Your account could not be created."
                );

            }


            /*
             * If email confirmation is disabled,
             * Supabase gives us a session immediately.
             */

            if (data.session) {

                const { error: profileError } =
                    await supabaseClient
                        .from("profiles")
                        .upsert({

                            id: data.user.id,

                            email: userEmail,

                            full_name: name,

                            role: "customer"

                        });


                if (profileError) {
                    throw profileError;
                }


                showMessage(
                    "Account created! Redirecting...",
                    "success"
                );


                setTimeout(() => {

                    window.location.href =
                        "dashboard.html";

                }, 800);


            } else {

                /*
                 * Email confirmation is enabled.
                 */

                showMessage(
                    "Account created! Check your email to confirm your account, then log in.",
                    "success"
                );

                authForm.reset();

            }

        }


        /* ==========================
           LOGIN
        ========================== */

        else {

            authButton.textContent =
                "Logging in...";


            const { data, error } =
                await supabaseClient.auth
                    .signInWithPassword({

                        email: userEmail,

                        password: userPassword

                    });


            if (error) {
                throw error;
            }


            if (!data.user) {

                throw new Error(
                    "Login failed."
                );

            }


            const user =
                data.user;


            /*
             * Find their profile.
             */

            let { data: profile, error: profileError } =
                await supabaseClient
                    .from("profiles")
                    .select("role, full_name")
                    .eq("id", user.id)
                    .maybeSingle();


            /*
             * If they don't have a profile,
             * create one automatically.
             */

            if (!profile && !profileError) {

                const { data: newProfile, error: createError } =
                    await supabaseClient
                        .from("profiles")
                        .insert({

                            id: user.id,

                            email: user.email,

                            full_name:
                                user.user_metadata?.full_name || "",

                            role: "customer"

                        })
                        .select("role, full_name")
                        .single();


                if (createError) {
                    throw createError;
                }


                profile = newProfile;

            }


            /*
             * STAFF → ADMIN PANEL
             */

            if (profile?.role === "staff") {

                window.location.href =
                    "admin.html";

                return;

            }


            /*
             * CUSTOMER → DASHBOARD
             */

            window.location.href =
                "dashboard.html";

        }


    } catch (error) {

        console.error(
            "NovaWeb Auth Error:",
            error
        );


        let message =
            error.message ||
            "Something went wrong.";


        /*
         * Make common Supabase errors
         * easier to understand.
         */

        if (
            message.toLowerCase().includes(
                "invalid login credentials"
            )
        ) {

            message =
                "Incorrect email or password.";

        }


        if (
            message.toLowerCase().includes(
                "email not confirmed"
            )
        ) {

            message =
                "Please confirm your email address before logging in.";

        }


        showMessage(
            message,
            "error"
        );

    }


    authButton.disabled = false;

    authButton.textContent =
        signupMode
            ? "Create Account"
            : "Login";

});


/* CHECK IF ALREADY LOGGED IN */

async function checkExistingSession() {

    const { data } =
        await supabaseClient.auth.getSession();


    if (!data.session) {
        return;
    }


    const user =
        data.session.user;


    const { data: profile } =
        await supabaseClient
            .from("profiles")
            .select("role")
            .eq("id", user.id)
            .maybeSingle();


    if (profile?.role === "staff") {

        window.location.href =
            "admin.html";

    } else {

        window.location.href =
            "dashboard.html";

    }

}


checkExistingSession();

</script>

</body>
</html>
