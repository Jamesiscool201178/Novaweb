<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NovaWeb | Customer Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase-config.js"></script>

</head>


<body class="dashboard-page">


<nav class="navbar">

    <div class="container navbar-inner">

        <a href="index.html" class="logo">
            Nova<span>Web</span>
        </a>


        <div class="dashboard-nav">

            <span id="welcomeText">
                Welcome
            </span>

            <button
                id="logoutButton"
                class="btn btn-secondary"
            >
                Logout
            </button>

        </div>

    </div>

</nav>


<main>

    <section class="dashboard-hero">

        <div class="container">

            <p class="eyebrow">
                CUSTOMER PORTAL
            </p>

            <h1>
                Your Projects
            </h1>

            <p>
                Track your NovaWeb projects and receive development updates.
            </p>

        </div>

    </section>


    <section>

        <div class="container">

            <div
                id="loading"
                class="dashboard-message"
            >
                Loading your projects...
            </div>


            <div
                id="projectsContainer"
                class="projects-grid"
            ></div>


            <div
                id="emptyState"
                class="empty-state"
                style="display:none;"
            >

                <div class="empty-icon">
                    +
                </div>

                <h2>
                    No projects yet
                </h2>

                <p>
                    Submit a website request to start your first project.
                </p>

                <a
                    href="index.html#request"
                    class="btn btn-primary"
                >
                    Request a Website
                </a>

            </div>

        </div>

    </section>

</main>


<script src="dashboard.js"></script>

</body>
</html>
